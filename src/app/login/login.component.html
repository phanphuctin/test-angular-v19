<div class="login-container">
  <form [formGroup]="loginForm">
    <div class="flex flex-column container">
        <mat-form-field>
          <mat-label>Enter your email</mat-label>
          <input
            matInput
            placeholder="pat@example.com"
            formControlName="email"
            (blur)="updateErrorMessage()"
            required
          />
          @if (this.loginForm.get('email').invalid) {
            <mat-error>{{errorMessage()}}</mat-error>
          }
        </mat-form-field>
      <mat-form-field class="mt-3">
        <mat-label>Password</mat-label>
        <input formControlName="password" matInput [type]="hide() ? 'password' : 'text'" />
        <button mat-icon-button matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()">
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
      <div class="flex justify-content-between mb-3 cursor-pointer">
        <a href="/signup">Sign Up</a>
        <a href="/forgot-password">Forgot password</a>
      </div>
      <button mat-raised-button (click)="submit()">Login</button>
    </div>
  </form>

</div>
